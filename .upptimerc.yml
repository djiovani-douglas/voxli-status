owner: djiovani-douglas
repo: voxli-status

sites:
  - name: Voxli Platform
    url: https://voxli.com.br
    icon: https://voxli.com.br/favicon.ico
    maxResponseTime: 3000
  - name: Voxli Admin
    url: https://admin.voxli.com.br
    icon: https://voxli.com.br/favicon.ico
    maxResponseTime: 3000
  - name: Voxli Portal
    url: https://demo.voxli.com.br
    icon: https://voxli.com.br/favicon.ico
    maxResponseTime: 3000

status-website:
  cname: status.voxli.com.br
  name: Voxli Status
  introTitle: Status da Plataforma Voxli
  introMessage: |
    Monitoramento em tempo real da infraestrutura Voxli. Todos os serviços são verificados a cada 5 minutos.

    <div class="voxli-trust-band">
      <div class="voxli-trust-item">Monitoramento contínuo, 24 horas por dia</div>
      <div class="voxli-trust-item">Incidentes reportados publicamente</div>
      <div class="voxli-trust-item">Histórico de disponibilidade transparente</div>
    </div>

    <div class="voxli-services">
      <div class="voxli-service"><span class="voxli-service-name">Voxli Platform</span><span class="voxli-service-desc">APIs internas da plataforma</span></div>
      <div class="voxli-service"><span class="voxli-service-name">Voxli Admin</span><span class="voxli-service-desc">Painel administrativo (backoffice)</span></div>
      <div class="voxli-service"><span class="voxli-service-name">Voxli Portal</span><span class="voxli-service-desc">Aplicação pública de demonstração</span></div>
    </div>

    <div class="voxli-uptime-history" id="voxli-uptime-history"></div>

  favicon: https://raw.githubusercontent.com/djiovani-douglas/voxli-status/HEAD/assets/favicon.ico
  faviconSvg: https://raw.githubusercontent.com/djiovani-douglas/voxli-status/HEAD/assets/favicon.svg
  logoUrl: https://raw.githubusercontent.com/djiovani-douglas/voxli-status/HEAD/assets/logo.svg
  navbar:
    - title: Status
      href: /
    - title: Voxli
      href: https://voxli.com.br

  customFootHtml: |
    <div class="voxli-footer-links">
      <a href="https://voxli.com.br/trust/" target="_blank" rel="noopener">Trust Center</a>
    </div>

  js: |
    window.addEventListener('load', function () {
      var REPO = 'https://raw.githubusercontent.com/djiovani-douglas/voxli-status/HEAD/';
      var services = ['voxli-platform', 'voxli-admin', 'voxli-portal'];

      function withTimeout(promise, ms) {
        return Promise.race([
          promise,
          new Promise(function (_, reject) {
            setTimeout(function () { reject(new Error('timeout')); }, ms);
          })
        ]);
      }

      function fetchJson(path) {
        return withTimeout(fetch(REPO + path).then(function (r) {
          if (!r.ok) throw new Error('bad response');
          return r.json();
        }), 4000);
      }

      function fetchText(path) {
        return withTimeout(fetch(REPO + path).then(function (r) {
          if (!r.ok) throw new Error('bad response');
          return r.text();
        }), 4000);
      }

      function insertStat(label, value, tooltip) {
        var anchor = document.querySelector('.status-bar') || document.querySelector('main');
        if (!anchor || !anchor.parentNode) return;
        var card = document.querySelector('.voxli-live-stats');
        if (!card) {
          card = document.createElement('div');
          card.className = 'voxli-live-stats';
          anchor.parentNode.insertBefore(card, anchor.nextSibling);
        }
        var stat = document.createElement('div');
        stat.className = 'voxli-stat';
        if (tooltip) stat.title = tooltip;
        var value_ = document.createElement('span');
        value_.className = 'voxli-stat-value';
        value_.textContent = value;
        var label_ = document.createElement('span');
        label_.className = 'voxli-stat-label';
        label_.textContent = label;
        stat.appendChild(value_);
        stat.appendChild(label_);
        card.appendChild(stat);
      }

      Promise.all(services.map(function (s) { return fetchJson('api/' + s + '/uptime.json'); }))
        .then(function (results) {
          var values = results
            .map(function (r) { return parseFloat(r && r.message); })
            .filter(function (n) { return !isNaN(n); });
          if (values.length !== services.length) return null;
          var avg = values.reduce(function (a, b) { return a + b; }, 0) / values.length;
          return avg.toFixed(2).replace('.', ',') + '%';
        })
        .catch(function () { return null; })
        .then(function (aggUptime) {
          if (!aggUptime) return;
          insertStat(
            'Disponibilidade da plataforma',
            aggUptime,
            'Média simples entre Voxli Platform, Voxli Admin e Voxli Portal (histórico completo)'
          );
        });

      Promise.all(services.map(function (s) { return fetchText('history/' + s + '.yml'); }))
        .then(function (texts) {
          var dates = texts
            .map(function (t) {
              var m = t.match(/lastUpdated:\s*(.+)/);
              return m ? new Date(m[1].trim()) : null;
            })
            .filter(function (d) { return d && !isNaN(d.getTime()); });
          if (!dates.length) return null;
          var latest = new Date(Math.max.apply(null, dates));
          var minutes = Math.round((Date.now() - latest.getTime()) / 60000);
          if (minutes < 0 || minutes > 24 * 60) return null;
          return minutes <= 1 ? 'agora mesmo' : 'há ' + minutes + ' min';
        })
        .catch(function () { return null; })
        .then(function (lastCheck) {
          if (!lastCheck) return;
          insertStat('Última verificação', lastCheck, null);
        });

      var serviceMeta = [
        { slug: 'voxli-platform', name: 'Voxli Platform' },
        { slug: 'voxli-admin', name: 'Voxli Admin' },
        { slug: 'voxli-portal', name: 'Voxli Portal' }
      ];

      function dateStr(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      fetchJson('history/summary.json')
        .then(function (summary) {
          if (!Array.isArray(summary)) return null;
          var host = document.getElementById('voxli-uptime-history');
          if (!host) return null;

          var title = document.createElement('div');
          title.className = 'voxli-uh-title';
          title.textContent = 'Histórico de disponibilidade (90 dias)';
          host.appendChild(title);

          var days = 90;
          var today = new Date();
          today.setHours(0, 0, 0, 0);

          serviceMeta.forEach(function (meta) {
            var entry = summary.filter(function (s) { return s.slug === meta.slug; })[0];
            if (!entry) return;

            var row = document.createElement('div');
            row.className = 'voxli-uh-row';

            var name = document.createElement('span');
            name.className = 'voxli-uh-name';
            name.textContent = meta.name;
            row.appendChild(name);

            var bars = document.createElement('div');
            bars.className = 'voxli-uh-bars';
            var down = entry.dailyMinutesDown || {};
            for (var i = days - 1; i >= 0; i--) {
              var d = new Date(today);
              d.setDate(d.getDate() - i);
              var key = dateStr(d);
              var mins = down[key] || 0;
              var bar = document.createElement('div');
              bar.className = 'voxli-uh-bar';
              if (mins <= 0) bar.style.background = 'var(--voxli-success)';
              else if (mins < 360) bar.style.background = 'var(--voxli-warning)';
              else bar.style.background = 'var(--voxli-danger)';
              bar.title = key + (mins > 0 ? ': ' + mins + ' min indisponível' : ': operacional');
              bars.appendChild(bar);
            }
            row.appendChild(bars);

            var pct = document.createElement('span');
            pct.className = 'voxli-uh-pct';
            pct.textContent = entry.uptime || '';
            row.appendChild(pct);

            host.appendChild(row);
          });

          var labels = document.createElement('div');
          labels.className = 'voxli-uh-labels';
          labels.innerHTML = '<span>90 dias atrás</span><span>Hoje</span>';
          host.appendChild(labels);
        })
        .catch(function () {
          var host = document.getElementById('voxli-uptime-history');
          if (host) host.remove();
        });
    });

  css: |
    :root {
      --voxli-navy: #0b2a4a;
      --voxli-navy-light: #123a63;
      --body-background-color: #f6f7f9;
      --body-text-color: #14202e;
      --card-background-color: #ffffff;
      --nav-background-color: #0b2a4a;
      --nav-border-bottom-color: #0b2a4a;
      --nav-color: #f6f7f9;
      --tag-color: #0b2a4a;

      --voxli-muted: #5b6b7c;
      --voxli-border: rgba(11, 42, 74, 0.12);
      --voxli-success: #16a34a;
      --voxli-success-bg: rgba(22, 163, 74, 0.12);
      --voxli-warning: #d97706;
      --voxli-warning-bg: rgba(217, 119, 6, 0.12);
      --voxli-danger: #dc2626;
      --voxli-danger-bg: rgba(220, 38, 38, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --body-background-color: #0b1420;
        --body-text-color: #e6ecf3;
        --card-background-color: #101c2c;
        --nav-background-color: #081726;
        --nav-border-bottom-color: #0b2a4a;
        --voxli-muted: #93a3b5;
        --voxli-border: rgba(230, 236, 243, 0.12);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    nav {
      background: var(--nav-background-color) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      padding: 0.85rem 1.5rem;
    }
    nav a { color: var(--nav-color) !important; font-weight: 600; letter-spacing: 0.01em; }
    nav a:hover { color: #a9c4e3 !important; }
    .logo { font-size: 1.05rem !important; font-weight: 700 !important; }
    .logo img { height: 26px; margin-right: 8px; }

    h1 { color: var(--body-text-color); font-weight: 700; font-size: 1.85rem; letter-spacing: -0.01em; }
    p.description { color: var(--voxli-muted); font-size: 0.97rem; }

    /* Faixa de confiança, serviços monitorados e histórico (introMessage) */
    .voxli-trust-band,
    .voxli-services,
    .voxli-uptime-history,
    .voxli-live-stats {
      width: 100%;
      box-sizing: border-box;
    }
    .voxli-trust-band {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin: 1.1rem 0;
      padding: 1.1rem 1.2rem;
      background: var(--card-background-color);
      border: 1px solid var(--voxli-border);
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(11, 42, 74, 0.05);
      font-size: 0.85rem;
      color: var(--voxli-muted);
      text-align: center;
    }
    .voxli-trust-item {
      padding: 0.35rem 0.5rem;
      border-left: 1px solid var(--voxli-border);
    }
    .voxli-trust-item:first-child { border-left: none; }

    .voxli-services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin: 0 0 1.1rem;
      padding: 1.1rem 1.2rem;
      background: var(--card-background-color);
      border: 1px solid var(--voxli-border);
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(11, 42, 74, 0.05);
    }
    .voxli-service {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      text-align: center;
    }
    .voxli-service-name { font-weight: 700; font-size: 0.92rem; color: var(--voxli-navy); }
    .voxli-service-desc { font-size: 0.8rem; color: var(--voxli-muted); }

    /* Histórico de disponibilidade — 90 dias (estilo Stripe/Railway, inserido via JS) */
    .voxli-uptime-history {
      margin: 0 0 1.1rem;
      padding: 1.1rem 1.2rem;
      background: var(--card-background-color);
      border: 1px solid var(--voxli-border);
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(11, 42, 74, 0.05);
    }
    .voxli-uh-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.9rem; }
    .voxli-uh-row {
      display: grid;
      grid-template-columns: 8.5rem 1fr 4rem;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
    }
    .voxli-uh-name { font-size: 0.82rem; font-weight: 600; color: var(--body-text-color); }
    .voxli-uh-bars { display: flex; gap: 2px; height: 22px; }
    .voxli-uh-bar { flex: 1; border-radius: 2px; min-width: 2px; }
    .voxli-uh-pct { font-size: 0.82rem; font-weight: 600; text-align: right; color: var(--voxli-muted); }
    .voxli-uh-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--voxli-muted);
      margin-top: 0.3rem;
    }

    @media (max-width: 640px) {
      .voxli-trust-band, .voxli-services { grid-template-columns: 1fr; text-align: left; }
      .voxli-trust-item { border-left: none; padding: 0.15rem 0; }
      .voxli-service { text-align: left; }
      .voxli-uh-row { grid-template-columns: 5.5rem 1fr 3rem; gap: 0.5rem; }
    }

    /* Cartão de estatísticas ao vivo (inserido via JS, com fallback gracioso) */
    .voxli-live-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin: 1rem 0;
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--voxli-border);
      border-radius: 12px;
      background: var(--card-background-color);
    }
    .voxli-stat { display: flex; flex-direction: column; cursor: default; }
    .voxli-stat-value { font-weight: 700; font-size: 1.05rem; color: var(--voxli-navy); }
    .voxli-stat-label { font-size: 0.78rem; color: var(--voxli-muted); }

    /* Bloco "Estado atual" nativo, com pulso sutil indicando monitoramento ao vivo */
    .status-bar {
      background: var(--voxli-success-bg);
      border: 1px solid rgba(22, 163, 74, 0.35);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      position: relative;
    }
    .status-bar.all-good {
      color: #14532d;
      font-weight: 600;
      animation: voxli-pulse-ring 2.4s ease-in-out infinite;
    }
    @keyframes voxli-pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.22); }
      50% { box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-bar.all-good { animation: none; }
    }

    /* Cards de serviço e incidentes */
    article, .component {
      border-radius: 14px !important;
      border: 1px solid var(--voxli-border) !important;
      box-shadow: 0 1px 3px rgba(11, 42, 74, 0.06) !important;
      transition: box-shadow 0.15s ease;
      background: var(--card-background-color) !important;
    }
    article:hover { box-shadow: 0 6px 16px rgba(11, 42, 74, 0.1) !important; }
    article h2 { font-weight: 600; color: var(--body-text-color); }

    .uptime-tag {
      background: var(--voxli-navy) !important;
      border-radius: 6px;
      font-weight: 600;
    }

    /* Severidade real (up / degraded / down) */
    .up { border-left: 3px solid var(--voxli-success) !important; }
    .degraded { border-left: 3px solid var(--voxli-warning) !important; }
    .down { border-left: 3px solid var(--voxli-danger) !important; }

    /* Estado do incidente */
    .tag.open { background: var(--voxli-danger) !important; color: #fff !important; }
    .tag.closed { background: var(--voxli-success) !important; color: #fff !important; }

    /* Pills de período (24h / 7d / 30d / 1a / tudo) */
    a[href*="24h"], a[href*="7d"], a[href*="30d"], a[href*="1y"], a[href*="all"] {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--voxli-border);
      text-decoration: none !important;
      margin-left: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* Linha do tempo dentro da página de UM incidente (comments/updates da mesma issue).
       Escopo restrito a .incident, pra não conectar visualmente itens da lista
       "Past Incidents" na home, que são incidentes diferentes e não uma sequência. */
    .incident section > article {
      position: relative;
      margin-left: 1.4rem;
      padding-left: 1.2rem !important;
    }
    .incident section > article::before {
      content: "";
      position: absolute;
      left: -1.4rem;
      top: 0.35rem;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--voxli-navy);
    }
    .incident section > article::after {
      content: "";
      position: absolute;
      left: calc(-1.4rem + 4px);
      top: 0.9rem;
      bottom: -1.6rem;
      width: 2px;
      background: var(--voxli-border);
    }
    .incident section > article:last-child::after { display: none; }

    footer, .footer { opacity: 0.6; font-size: 0.8rem; }
    .voxli-footer-links { text-align: center; padding: 0.5rem 0 1.5rem; font-size: 0.8rem; }
    .voxli-footer-links a { color: var(--voxli-navy); text-decoration: underline; }

    @media (max-width: 640px) {
      .voxli-live-stats { flex-direction: column; gap: 0.6rem; }
    }

i18n:
  liveStatus: Status em tempo real
  up: Operacional
  down: Fora do ar
  degraded: Degradado
  allSystemsOperational: Todos os sistemas operacionais ✅
  degradedPerformance: Desempenho degradado ⚠️
  completeOutage: Indisponibilidade total 🔴
  partialOutage: Indisponibilidade parcial 🟠
  duration24H: 24h
  duration7D: 7d
  duration30D: 30d
  duration1Y: 1a
  durationAll: tudo
  overallUptime: "Uptime geral: $UPTIME"
  overallUptimeTitle: Uptime geral
  averageResponseTime: "Tempo médio de resposta: $TIME"
  averageResponseTimeTitle: Tempo médio de resposta
  ms: ms
  uptime: Disponibilidade
  uptimeDay: Disponibilidade (24h)
  uptimeWeek: Disponibilidade (7 dias)
  uptimeMonth: Disponibilidade (30 dias)
  uptimeYear: Disponibilidade (1 ano)
  responseTime: Tempo de resposta
  responseTimeDay: Tempo de resposta (24h)
  responseTimeWeek: Tempo de resposta (7 dias)
  responseTimeMonth: Tempo de resposta (30 dias)
  responseTimeYear: Tempo de resposta (1 ano)
  responseTimeGraphAlt: Gráfico de tempo de resposta
  status: Status
  history: Histórico
  url: URL
  pastIncidents: Incidentes anteriores
  pastIncidentsResolved: "Resolvido em $MINUTES minutos com $POSTS posts"
  incidentReport: "Incidente #$NUMBER: relatório →"
  footer: "Desenvolvido com [Upptime]($REPO)"
